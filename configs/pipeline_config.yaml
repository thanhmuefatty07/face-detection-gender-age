# Pipeline Configuration for Kaggle Face Mining, Morphometry & Extreme Filtering
# Project: Face Detection, Gender/Age & Biological Morphometry Pipeline

environment:
  runtime: "kaggle_cloud_gpu"
  kaggle_input_dir: "/kaggle/input"
  kaggle_working_dir: "/kaggle/working"
  local_reports_dir: "reports"
  random_seed: 42

ingestion:
  max_samples_per_dataset: 50000
  supported_extensions: [".jpg", ".jpeg", ".png", ".webp", ".bmp"]
  datasets:
    agedb:
      kaggle_slug: "nitingandhi/agedb-database"
      pattern: "^(\\d+)_(.+)_(\\d+)_([mf])\\.jpg"
      min_age: 1
      max_age: 101
      demographics: "50/50 gender balance, 100% verified DOB and photo date"
    morph:
      kaggle_slug: "chiragsaipanuganti/morph"
      pattern: "^(\\d+)_(\\d+)([MF])(\\d{2})\\.JPG"
      min_age: 16
      max_age: 77
      demographics: "Official ID mugshots, African-American & Caucasian representation"
    afad:
      kaggle_slug: "lyk1652/afad-full"
      root_folder: "AFAD-Full"
      min_age: 15
      max_age: 40
      demographics: "East Asian verified student IDs"
    appa_real:
      kaggle_slug: "vnthanhphm/appa-real-age-only-v1"
      metadata_files: ["labels_train.csv", "labels_valid.csv"]
      min_age: 1
      max_age: 85
      demographics: "Real biological age + apparent age distribution with annotator variance"
    fgnet:
      kaggle_slug: "pdombrza/fgnet-gendered"
      pattern: "^(\\d{3})[aA](\\d{2})([mMfF])?"
      min_age: 0
      max_age: 69
      demographics: "Dense longitudinal infancy to adolescence (0-18)"
    b3fd:
      kaggle_slug: "moritzm00/biometrically-filtered-famous-figure-dataset"
      filename_format: "{name}/{id}_{dob}_{photo_year}.jpg"
      min_age: 1
      max_age: 101
      demographics: "Biometrically filtered figures, elderly representation (>60)"
    fairface:
      kaggle_slug: "jovian/fairface-dataset"
      archive_names: ["fairface-img-margin025.zip", "fairface-img-margin125.zip"]
      labels: ["fairface_label_train.csv", "fairface_label_val.csv"]
    imdb_wiki:
      kaggle_slug: "dimitrisk/imdb-wiki-dataset"
      mat_files: ["imdb.mat", "wiki.mat"]
      tar_files: ["imdb_crop.tar", "wiki_crop.tar"]
      min_face_score: 1.0
      max_second_face_score: 0.5
    adience:
      kaggle_slug: "ttungl/adience-benchmark-gender-and-age-classification"
      fold_files: ["fold_0_data.txt", "fold_1_data.txt", "fold_2_data.txt", "fold_3_data.txt", "fold_4_data.txt"]
      min_age: 0
      max_age: 100
      demographics: "Unfiltered real-world smartphone/Flickr human faces with age intervals and gender"
    axon_age:
      kaggle_slug: "trainingdatapro/age-detection-human-faces-18-50-years"
      min_age: 18
      max_age: 80
      demographics: "Real webcam and smartphone selfie human faces with age brackets and gender"
    megaage_asian:
      kaggle_slug: "megaage/megaage-asian"
      min_age: 1
      max_age: 70
      demographics: "40,000+ East and Southeast Asian faces with posterior age distributions"
    lagenda:
      kaggle_slug: "lagenda/lagenda-age-gender"
      min_age: 0
      max_age: 95
      demographics: "In-the-wild human face benchmark with verified age intervals and gender"
    cacd:
      kaggle_slug: "cacd/cross-age-celebrity-dataset"
      min_age: 14
      max_age: 62
      demographics: "Cross-age longitudinal subjects across 10-year spans"
    aaf:
      kaggle_slug: "allagefaces/all-age-faces-dataset"
      min_age: 2
      max_age: 80
      demographics: "Balanced age (2-80) and gender human face dataset"

crawler:
  enabled: true
  max_queries: 220
  images_per_query: 20
  max_workers: 8
  request_timeout_sec: 10
  rate_limit_delay_sec: 0.25
  max_retries: 3
  backoff_factor: 1.5
  output_subfolder: "web_crawled"

quota_manager:
  max_working_gb: 18.0
  warning_working_gb: 15.0
  min_free_gb: 2.5
  shard_image_count: 5000
  shard_archive_format: "tar"
  jpeg_quality: 95

quality_filtering:
  target_resolution: 224
  min_face_size: 112
  min_laplacian_var: 100.0
  min_tenengrad: 250.0
  max_abs_yaw_deg: 35.0
  max_abs_pitch_deg: 25.0
  max_abs_roll_deg: 20.0
  min_luminance_l: 35.0
  max_luminance_l: 220.0
  max_clipping_fraction: 0.08
  max_cheek_delta_e: 22.0
  min_landmark_confidence: 0.65

deduplication:
  phash_hamming_threshold: 6
  cosine_distance_threshold: 0.35
  cross_split_hamming_min: 7

morphometry_ldl:
  age_paradigm: "fine_grained_3_to_5_year_intervals"
  num_fine_age_intervals: 23
  fine_age_intervals:
    - {name: "0-2", low: 0, high: 2, span_years: 3}
    - {name: "3-5", low: 3, high: 5, span_years: 3}
    - {name: "6-8", low: 6, high: 8, span_years: 3}
    - {name: "9-11", low: 9, high: 11, span_years: 3}
    - {name: "12-14", low: 12, high: 14, span_years: 3}
    - {name: "15-17", low: 15, high: 17, span_years: 3}
    - {name: "18-21", low: 18, high: 21, span_years: 4}
    - {name: "22-25", low: 22, high: 25, span_years: 4}
    - {name: "26-30", low: 26, high: 30, span_years: 5}
    - {name: "31-35", low: 31, high: 35, span_years: 5}
    - {name: "36-40", low: 36, high: 40, span_years: 5}
    - {name: "41-45", low: 41, high: 45, span_years: 5}
    - {name: "46-50", low: 46, high: 50, span_years: 5}
    - {name: "51-55", low: 51, high: 55, span_years: 5}
    - {name: "56-60", low: 56, high: 60, span_years: 5}
    - {name: "61-65", low: 61, high: 65, span_years: 5}
    - {name: "66-70", low: 66, high: 70, span_years: 5}
    - {name: "71-75", low: 71, high: 75, span_years: 5}
    - {name: "76-80", low: 76, high: 80, span_years: 5}
    - {name: "81-85", low: 81, high: 85, span_years: 5}
    - {name: "86-90", low: 86, high: 90, span_years: 5}
    - {name: "91-95", low: 91, high: 95, span_years: 5}
    - {name: "96-100", low: 96, high: 100, span_years: 5}
  age_cohorts:
    - name: "0-2"
      low: 0.0
      high: 2.5
      center: 1.0
    - name: "3-6"
      low: 2.5
      high: 6.5
      center: 4.5
    - name: "7-12"
      low: 6.5
      high: 12.5
      center: 9.5
    - name: "13-17"
      low: 12.5
      high: 17.5
      center: 15.0
    - name: "18-24"
      low: 17.5
      high: 24.5
      center: 21.0
    - name: "25-34"
      low: 24.5
      high: 34.5
      center: 29.5
    - name: "35-44"
      low: 34.5
      high: 44.5
      center: 39.5
    - name: "45-54"
      low: 44.5
      high: 54.5
      center: 49.5
    - name: "55-64"
      low: 54.5
      high: 64.5
      center: 59.5
    - name: "65+"
      low: 64.5
      high: 100.0
      center: 72.0
  dimorphism:
    w_min: 0.25
    alpha: 1.0
    beta: 0.15
    sigma_0: 0.05
    sigma_max: 0.45
    gamma_1: 1.20
    gamma_2: 1.35
  ethnic_aging:
    east_asian_cliff_age: 48.0
    east_asian_delta_youth: 4.5
    east_asian_kappa_cliff: 1.30
    caucasian_photo_factor: 1.05
    black_photoprotection_offset: -3.5
    south_asian_tear_trough_offset: 2.5
  ldl_integration:
    default_sigma_min: 2.0
    lambda_age: 0.85
    alpha_emd: 0.50

multi_teacher:
  teachers: ["InsightFace_ArcFace", "MiVOLO", "FairFace", "CLIP"]
  max_epistemic_age_std: 8.0
  max_child_epistemic_age_std: 5.5
  min_adult_gender_confidence: 0.70
  max_adult_gender_std: 0.35
  max_clip_contradiction_margin: 0.35

export_packaging:
  owner: "vnthanhphm"
  dataset_slug: "face-gender-age-golden-dataset"
  dataset_title: "Face Gender Age Biological SOTA Dataset"
  license: "CC0-1.0"
  manifest_parquet: "metadata.parquet"
  manifest_csv: "metadata.csv"

